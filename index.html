*{box-sizing:border-box}body{margin:0;background:#f7f2e9;color:#181512;font-family:Arial,sans-serif}header{position:sticky;top:0;background:#fff;z-index:5;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}.logo{font:24px Georgia;letter-spacing:2px}.logo span{color:#b08a45}nav{display:flex;gap:7px;align-items:center}button{border:0;border-radius:6px;padding:10px 14px;cursor:pointer}.gold{background:#b08a45;color:#fff}.light{background:#fff;border:1px solid #b08a45}.hero{padding:80px 20px;text-align:center;color:#fff;background:linear-gradient(#0008,#0008),url('https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=1800&q=85') center/cover}.hero h1{font:54px Georgia;margin:0 0 12px}.wrap{max-width:1150px;margin:auto;padding:45px 20px}.title{text-align:center;font:34px Georgia}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 22px #0001}.card img{width:100%;height:320px;object-fit:cover}.body{padding:16px}.price{color:#b08a45;font-weight:bold;font-size:19px}.cart{position:fixed;bottom:18px;left:18px;background:#181512;color:#fff;padding:13px 18px;border-radius:30px;z-index:8}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:5vh 15px;overflow:auto}.box{max-width:700px;margin:auto;background:#fff;padding:24px;border-radius:12px}.close{float:left;background:#eee}.field{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:6px}.line{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.success{padding:14px;background:#edf8ed;border-radius:7px}footer{background:#181512;color:#fff;text-align:center;padding:28px}

{
  "@context": "https://schema.org",
  "@type": "OnlineStore",
  "name": "AFNAN COUTURE",
  "url": "https://wdtalha112233-afk.github.io/AFNAN_COUTURE/",

</head><body>
<header><div class="logo">AFNAN <span>COUTURE</span></div><nav><button class="light" onclick="toggleLang()" id="lang">English</button><button class="gold" onclick="openCart()">🛒 <span id="ct">0</span></button></nav></header>
<section class="hero"><h1>AFNAN COUTURE</h1><p id="hero">أناقة فاخرة بلمسة سودانية راقية</p><button class="gold" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})" id="shopBtn">تسوقي المجموعة</button></section>
<main class="wrap" id="shop"><h2 class="title" id="title">المجموعة المميزة</h2><div class="grid" id="products"></div></main>
<footer>AFNAN COUTURE<br><small id="cod">الدفع عند الاستلام متاح</small></footer>
<div class="cart" onclick="openCart()">🛒 <span id="bar">0</span></div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeCart()">✕</button><h2 id="cartTitle">سلة المشتريات</h2><div id="lines"></div><h3 id="total"></h3><hr><h3 id="checkoutTitle">إتمام الطلب — الدفع عند الاستلام</h3><input id="name" class="field" placeholder="الاسم الكامل"><input id="phone" class="field" placeholder="رقم الهاتف"><textarea id="address" class="field" placeholder="عنوان التوصيل"></textarea><input id="city" class="field" placeholder="المدينة / الدولة"><button class="gold" onclick="order()" id="confirm">تأكيد الطلب</button><div id="result"></div></div></div>
<script>
let lang='ar',p=[],cart=[];
const ar={hero:'أناقة فاخرة بلمسة سودانية راقية',shop:'تسوقي المجموعة',title:'المجموعة المميزة',cod:'الدفع عند الاستلام متاح',cart:'سلة المشتريات',checkout:'إتمام الطلب — الدفع عند الاستلام',name:'الاسم الكامل',phone:'رقم الهاتف',address:'عنوان التوصيل',city:'المدينة / الدولة',confirm:'تأكيد الطلب',empty:'السلة فارغة',added:'تمت الإضافة إلى السلة',complete:'يرجى إكمال بيانات التوصيل',done:'تم تأكيد الطلب. رقم الطلب: '};
const en={hero:'Luxury fashion with refined Sudanese-inspired elegance.',shop:'Shop Collection',title:'Featured Collection',cod:'Cash on Delivery available',cart:'Your Cart',checkout:'Checkout — Cash on Delivery',name:'Full name',phone:'Phone number',address:'Delivery address',city:'City / Country',confirm:'Confirm Order',empty:'Your cart is empty',added:'Added to cart',complete:'Please complete your delivery details',done:'Order confirmed. Order number: '};
function t(k){return(lang==='ar'?ar:en)[k]}
function toggleLang(){lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=lang==='ar'?'English':'العربية';['hero','shopBtn','title','cod','cartTitle','checkoutTitle','confirm'].forEach(id=>document.getElementById(id).textContent=t(id==='shopBtn'?'shop':id==='cartTitle'?'cart':id==='checkoutTitle'?'checkout':id));document.getElementById('name').placeholder=t('name');document.getElementById('phone').placeholder=t('phone');document.getElementById('address').placeholder=t('address');document.getElementById('city').placeholder=t('city');render()}
async function init(){p=await fetch('products.json').then(r=>r.json());render();update()}
function render(){document.getElementById('products').innerHTML=p.map((x,i)=>`<article class="card"><img src="${x.image}" alt="${lang==='ar'?x.name_ar:x.name}"><div class="body"><h3>${lang==='ar'?x.name_ar:x.name}</h3><p>${lang==='ar'?x.category_ar:x.category}</p><div class="price">${x.price}</div><button class="gold" onclick="add(${i})">${lang==='ar'?'أضف للسلة':'Add to cart'}</button></div></article>`).join('')}
function add(i){cart.push(i);update();alert(t('added'))}
function update(){document.getElementById('ct').textContent=cart.length;document.getElementById('bar').textContent=cart.length}
function openCart(){renderCart();document.getElementById('modal').style.display='block'}function closeCart(){document.getElementById('modal').style.display='none'}
function renderCart(){let c={};cart.forEach(i=>c[i]=(c[i]||0)+1);document.getElementById('lines').innerHTML=Object.entries(c).map(([i,q])=>`<div class="line"><span>${lang==='ar'?p[i].name_ar:p[i].name} × ${q}</span><button onclick="remove(${i})">−</button></div>`).join('')||`<p>${t('empty')}</p>`}
function remove(i){let n=cart.indexOf(+i);if(n>=0)cart.splice(n,1);update();renderCart()}
function order(){if(!cart.length)return alert(t('empty'));let fields=['name','phone','address','city'];if(fields.some(x=>!document.getElementById(x).value.trim()))return alert(t('complete'));let id='AFN-'+Date.now().toString().slice(-8);document.getElementById('result').innerHTML=`<div class="success">${t('done')}<b>${id}</b><br>${lang==='ar'?'الدفع عند الاستلام':'Cash on Delivery'}</div>`;cart=[];update();renderCart()}
init();
</script></body></html>
